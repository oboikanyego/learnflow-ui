name: UI CI
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build Angular app
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnflow-ui-build-log
          path: build.log
          retention-days: 3
      - name: Upload application bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: learnflow-ui-dist
          path: dist/learnflow-ui
          retention-days: 3
