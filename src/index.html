<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LearnFlow</title><base href="/"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="LearnFlow turns learning plans into focused study, measurable mastery and evidence-backed career progress."><meta name="theme-color" content="#0f172a"><meta name="color-scheme" content="light dark"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="icon" type="image/svg+xml" href="/learnflow-logo.svg"><link rel="shortcut icon" href="/learnflow-logo.svg"><script>(function(){try{var saved=localStorage.getItem('learnflow_theme');var theme=saved==='light'||saved==='dark'?saved:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;}catch(e){document.documentElement.dataset.theme='light';document.documentElement.style.colorScheme='light';}})();</script></head><body><a class="skip-link" href="#learnflow-main">Skip to main content</a><app-root></app-root><button id="learnflow-theme-toggle" class="learnflow-theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"><span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark</span></button><script>(function(){var button=document.getElementById('learnflow-theme-toggle');if(!button)return;function current(){return document.documentElement.dataset.theme==='dark'?'dark':'light';}function render(){var dark=current()==='dark';button.querySelector('.theme-toggle-icon').textContent=dark?'☀':'☾';button.querySelector('.theme-toggle-label').textContent=dark?'Light':'Dark';button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');}button.addEventListener('click',function(){var next=current()==='dark'?'light':'dark';document.documentElement.dataset.theme=next;document.documentElement.style.colorScheme=next;try{localStorage.setItem('learnflow_theme',next);}catch(e){}render();});render();})();(function(){var root=document.querySelector('app-root');if(!root)return;function wireMain(){var main=root.querySelector('main');if(main&&!main.id){main.id='learnflow-main';main.setAttribute('tabindex','-1');return true}return !!main}if(!wireMain()){var observer=new MutationObserver(function(){if(wireMain())observer.disconnect()});observer.observe(root,{childList:true,subtree:true})}})();</script></body></html>
