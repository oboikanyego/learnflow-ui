<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LearnFlow</title><base href="/"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c66e4"><meta name="color-scheme" content="light dark"><link rel="icon" type="image/svg+xml" href="/learnflow-logo.svg"><link rel="shortcut icon" href="/learnflow-logo.svg"><script>(function(){try{var saved=localStorage.getItem('learnflow_theme');var theme=saved==='light'||saved==='dark'?saved:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;}catch(e){document.documentElement.dataset.theme='light';document.documentElement.style.colorScheme='light';}})();</script></head><body><app-root></app-root><button id="learnflow-theme-toggle" class="learnflow-theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"><span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark</span></button><script>(function(){var button=document.getElementById('learnflow-theme-toggle');if(!button)return;function current(){return document.documentElement.dataset.theme==='dark'?'dark':'light';}function render(){var dark=current()==='dark';button.querySelector('.theme-toggle-icon').textContent=dark?'☀':'☾';button.querySelector('.theme-toggle-label').textContent=dark?'Light':'Dark';button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');}button.addEventListener('click',function(){var next=current()==='dark'?'light':'dark';document.documentElement.dataset.theme=next;document.documentElement.style.colorScheme=next;try{localStorage.setItem('learnflow_theme',next);}catch(e){}render();});render();})();</script></body></html>
